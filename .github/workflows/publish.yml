name: Publish to npm

# Runs when a GitHub Release is published. Uses npm trusted publishing (OIDC),
# so no npm token is stored in the repository: configure this workflow as a
# trusted publisher for the "@gitmetrics/app" package on npmjs.com, with
# "Allow npm publish" enabled so each release goes public without a manual step.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC for trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci

      - name: Check that the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version"
            exit 1
          fi

      # A version published by hand (like the very first one, before trusted
      # publishing can be set up) still gets its GitHub Release without failing here.
      - name: Skip versions already on npm
        id: npm
        run: |
          package=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$package@$version" version >/dev/null 2>&1; then
            echo "::notice::$package@$version is already on npm, nothing to publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm test
        if: steps.npm.outputs.published != 'true'
      - run: npm run build
        if: steps.npm.outputs.published != 'true'

      - name: Publish
        if: steps.npm.outputs.published != 'true'
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
